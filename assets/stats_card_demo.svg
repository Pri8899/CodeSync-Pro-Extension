      <text x="74" y="17" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e6edf3">84</text>
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.58s" fill="freeze"/>
    </g>
