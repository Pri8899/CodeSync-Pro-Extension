      <circle cx="12" cy="13" r="3.5" fill="#f0883e">
        <animate attributeName="r" values="0;3.5" dur="0.3s" begin="0.84s" fill="freeze"/>
      </circle>
      <text x="21" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#8b949e">LC</text>
      <text x="74" y="17" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e6edf3">36</text>
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.74s" fill="freeze"/>
