<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="495" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="streak-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <clipPath id="bar-clip">
      <rect x="24" y="118" width="447" height="7" rx="3.5"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 700; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #8b949e; letter-spacing: 0.5px; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .card-border { animation: fadeIn 0.4s ease-out forwards; }
    .header-group { animation: fadeIn 0.5s ease-out 0.1s both; }
    .stat-group { animation: slideUp 0.4s ease-out both; }
    .stat-g1 { animation-delay: 0.2s; }
    .stat-g2 { animation-delay: 0.28s; }
    .stat-g3 { animation-delay: 0.36s; }
    .stat-g4 { animation-delay: 0.44s; }
    .bar-track { animation: fadeIn 0.3s ease-out 0.5s both; }
    .footer-text { animation: fadeIn 0.4s ease-out 0.9s both; }
    .sync-dot { animation: pulseGlow 2s ease-in-out infinite; }
  </style>

  <!-- Card Background -->
  <rect class="card-border" x="0.5" y="0.5" width="494" height="194" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Logo Icon -->
  <g class="header-group" transform="translate(24, 20)">
    <rect width="24" height="24" rx="6" fill="#1c2129" stroke="#30363d" stroke-width="1"/>
    <path d="M13 3L6 13h5l-1 8 8-11h-5l1-7z" fill="url(#icon-grad)"/>
  </g>

  <!-- Header Text -->
  <g class="header-group">
    <text x="56" y="33" class="title">CodeSync Pro <tspan font-weight="400" fill="#6e7681">Workstation</tspan></text>
    <text x="56" y="47" class="subtitle">@developer • Competitive Programming Portfolio</text>
  </g>

  <!-- Live Status Badge -->
  <g class="header-group" transform="translate(390, 21)">
    <rect width="81" height="22" rx="11" fill="#1c2129" stroke="#30363d" stroke-width="1"/>
    <circle class="sync-dot" cx="11" cy="11" r="3.5" fill="#3fb950" filter="url(#glow)"/>
    <text x="20" y="14.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#3fb950" letter-spacing="0.4px">AUTO-SYNC</text>
  </g>

  <!-- Separator -->
  <line x1="24" y1="58" x2="471" y2="58" stroke="#21262d" stroke-width="1">
    <animate attributeName="x2" values="24;471" dur="0.4s" begin="0.15s" fill="freeze"/>
  </line>

  <!-- 4 Primary Stat Columns -->
  <g transform="translate(24, 68)">
    <!-- Solved -->
    <g class="stat-group stat-g1">
      <text x="0" y="20" class="stat-val" font-size="22" fill="#58a6ff">342</text>
      <text x="0" y="34" class="stat-lbl">TOTAL SOLVED</text>
    </g>

    <!-- Streak -->
    <g class="stat-group stat-g2">
      <text x="120" y="20" class="stat-val" font-size="22" fill="#f0883e">19<tspan font-size="13" font-weight="500" fill="#8b949e"> days</tspan></text>
      <text x="120" y="34" class="stat-lbl">CURRENT STREAK</text>
    </g>

    <!-- AC Accuracy -->
    <g class="stat-group stat-g3">
      <text x="245" y="20" class="stat-val" font-size="22" fill="#3fb950">82.4%</text>
      <text x="245" y="34" class="stat-lbl">AC ACCURACY</text>
    </g>

    <!-- Submissions -->
    <g class="stat-group stat-g4">
      <text x="360" y="20" class="stat-val" font-size="22" fill="#c9d1d9">415</text>
      <text x="360" y="34" class="stat-lbl">SUBMISSIONS</text>
    </g>
  </g>

  <!-- Segmented Progress Bar -->
  <g class="bar-track">
    <rect x="24" y="118" width="447" height="7" rx="3.5" fill="#21262d"/>
    <g clip-path="url(#bar-clip)">
      
      <rect x="24" y="118" width="0" height="7" fill="#58a6ff">
        <animate attributeName="width" from="0" to="203.89473684210526" dur="0.5s" begin="0.55s" fill="freeze"/>
      </rect>
      <rect x="227.89473684210526" y="118" width="0" height="7" fill="#3fb950">
        <animate attributeName="width" from="0" to="109.78947368421052" dur="0.5s" begin="0.6s" fill="freeze"/>
      </rect>
      <rect x="337.6842105263158" y="118" width="0" height="7" fill="#d29922">
        <animate attributeName="width" from="0" to="67.96491228070175" dur="0.5s" begin="0.65s" fill="freeze"/>
      </rect>
      <rect x="405.64912280701753" y="118" width="0" height="7" fill="#f0883e">
        <animate attributeName="width" from="0" to="47.05263157894736" dur="0.5s" begin="0.7s" fill="freeze"/>
      </rect>
      <rect x="452.7017543859649" y="118" width="0" height="7" fill="#a371f7">
        <animate attributeName="width" from="0" to="18.298245614035086" dur="0.5s" begin="0.75s" fill="freeze"/>
      </rect>
      
    </g>
  </g>

  <!-- Platform Solved Pills -->
  
    <g transform="translate(24, 137)" opacity="0">
      <rect width="83" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="12" cy="13" r="3.5" fill="#58a6ff">
        <animate attributeName="r" values="0;3.5" dur="0.3s" begin="0.6s" fill="freeze"/>
